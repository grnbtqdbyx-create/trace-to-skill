name: Agent Learning Report

on:
  pull_request:
  workflow_dispatch:

jobs:
  trace-to-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npx trace-to-skill analyze fixtures/safe-run.md --output agent-learning-report.md
      - run: npx trace-to-skill eval fixtures/safe-run.md --threshold 80
