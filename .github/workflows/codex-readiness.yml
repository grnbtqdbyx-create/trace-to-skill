name: Codex Readiness

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  doctor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          mode: doctor
          doctor-threshold: "95"
          doctor-comment: "true"
          github-token: ${{ github.token }}
