name: Codex Readiness

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  doctor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
      - id: readiness
        uses: ./
        with:
          mode: doctor
          doctor-threshold: "95"
          doctor-comment: "true"
          github-token: ${{ github.token }}
      - name: Show readiness outputs
        run: |
          echo "Codex readiness score: ${{ steps.readiness.outputs.doctor-score }}"
          echo "Codex readiness status: ${{ steps.readiness.outputs.doctor-status }}"
          echo "Codex readiness summary: ${{ steps.readiness.outputs.doctor-summary }}"
