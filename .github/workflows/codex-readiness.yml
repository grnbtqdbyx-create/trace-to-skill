name: Codex Readiness

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  doctor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
      - id: readiness
        uses: ./
        with:
          mode: all
          doctor-threshold: "95"
          doctor-comment: "true"
          scorecard-comment: "true"
          job-summary: "true"
          github-token: ${{ github.token }}
      - name: Show readiness outputs
        run: |
          echo "Codex readiness score: ${{ steps.readiness.outputs.doctor-score }}"
          echo "Codex readiness status: ${{ steps.readiness.outputs.doctor-status }}"
          echo "Codex readiness summary: ${{ steps.readiness.outputs.doctor-summary }}"
          echo "AGENTS lint status: ${{ steps.readiness.outputs.agents-lint-status }}"
          echo "GitHub context status: ${{ steps.readiness.outputs.context-status }}"
          echo "Benchmark status: ${{ steps.readiness.outputs.benchmark-status }}"
          echo "Benchmark cases: ${{ steps.readiness.outputs.benchmark-cases }}"
          echo "Scorecard status: ${{ steps.readiness.outputs.scorecard-status }}"
      - id: issue-map
        uses: ./
        with:
          mode: issue-map
          issue-map-path: fixtures/github-codex-issues-export.json
          job-summary: "true"
      - name: Show issue-map outputs
        run: |
          echo "Issue-map issues: ${{ steps.issue-map.outputs.issue-map-issues }}"
          echo "Issue-map matched: ${{ steps.issue-map.outputs.issue-map-matched }}"
          echo "Issue-map top kind: ${{ steps.issue-map.outputs.issue-map-top-kind }}"
      - id: issue-heat
        uses: ./
        with:
          mode: issue-heat
          issue-heat-path: fixtures/github-codex-issues-export.json
          issue-heat-window-hours: "99999"
          job-summary: "true"
      - name: Show issue-heat outputs
        run: |
          echo "Issue-heat issues: ${{ steps.issue-heat.outputs.issue-heat-issues }}"
          echo "Issue-heat considered: ${{ steps.issue-heat.outputs.issue-heat-considered }}"
          echo "Issue-heat matched: ${{ steps.issue-heat.outputs.issue-heat-matched }}"
          echo "Issue-heat top kind: ${{ steps.issue-heat.outputs.issue-heat-top-kind }}"
      - id: duplicate-audit
        uses: ./
        with:
          mode: duplicate-audit
          duplicate-audit-path: fixtures/codex-duplicate-audit.json
          job-summary: "true"
      - name: Show duplicate-audit outputs
        run: |
          echo "Duplicate-audit candidates: ${{ steps.duplicate-audit.outputs.duplicate-audit-candidates }}"
          echo "Duplicate-audit likely: ${{ steps.duplicate-audit.outputs.duplicate-audit-likely }}"
          echo "Duplicate-audit related: ${{ steps.duplicate-audit.outputs.duplicate-audit-related }}"
          echo "Duplicate-audit top verdict: ${{ steps.duplicate-audit.outputs.duplicate-audit-top-verdict }}"
