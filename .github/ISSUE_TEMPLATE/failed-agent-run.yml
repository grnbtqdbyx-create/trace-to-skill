name: Failed agent run
description: Share an anonymized failed Codex, Claude Code, Cursor, Copilot, or MCP-agent run.
title: "[trace] "
labels:
  - trace
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping build an evidence-backed failure taxonomy. Do not paste secrets, private code, or customer data.
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Codex
        - Claude Code
        - Cursor
        - Copilot coding agent
        - Gemini CLI
        - OpenCode
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: Anonymized trace excerpt
      description: Include the smallest safe excerpt that proves the failure.
      render: text
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: What rule or skill would have prevented this?

