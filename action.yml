name: trace-to-skill
description: Turn failed AI coding-agent runs into reusable AGENTS.md rules, SKILL.md files, and eval evidence.
author: grnbtqdbyx-create
branding:
  icon: check-circle
  color: green
inputs:
  mode:
    description: Run "traces", "agents-lint", "github-context", "doctor", "benchmark", "both", or "all".
    required: false
    default: traces
  doctor-path:
    description: Repository path to score with the Codex readiness doctor.
    required: false
    default: "."
  doctor-threshold:
    description: Minimum passing Codex readiness doctor score.
    required: false
    default: "85"
  doctor-comment:
    description: Post or update a pull request comment with the Codex readiness doctor summary.
    required: false
    default: "false"
  scorecard-comment:
    description: Post or update a pull request comment with the combined scorecard.
    required: false
    default: "false"
  traces:
    description: File or directory containing agent traces.
    required: false
    default: runs
  threshold:
    description: Minimum passing score.
    required: false
    default: "75"
  context-threshold:
    description: Minimum passing score for untrusted GitHub event context.
    required: false
    default: "80"
  github-token:
    description: GitHub token used to post or update a pull request comment.
    required: false
    default: ""
  comment:
    description: Post or update a pull request comment with the report.
    required: false
    default: "false"
  job-summary:
    description: Append generated reports to the GitHub Actions job summary.
    required: false
    default: "true"
outputs:
  doctor-score:
    description: Codex readiness doctor score, from 0 to 100.
    value: ${{ steps.doctor.outputs.score }}
  doctor-status:
    description: Codex readiness doctor status, either ready or needs-attention.
    value: ${{ steps.doctor.outputs.status }}
  doctor-summary:
    description: Codex readiness doctor summary text.
    value: ${{ steps.doctor.outputs.summary }}
  doctor-report:
    description: Path to the Markdown Codex readiness doctor report.
    value: ${{ steps.doctor.outputs.report }}
  doctor-json:
    description: Path to the JSON Codex readiness doctor report.
    value: ${{ steps.doctor.outputs.json }}
  agent-report:
    description: Path to the Markdown agent learning report.
    value: ${{ steps.agent-report.outputs.report }}
  agents-lint-score:
    description: AGENTS.md linter score, from 0 to 100.
    value: ${{ steps.agents-lint.outputs.score }}
  agents-lint-status:
    description: AGENTS.md linter status, either pass, warn, or fail.
    value: ${{ steps.agents-lint.outputs.status }}
  agents-lint-report:
    description: Path to the Markdown AGENTS.md linter report.
    value: ${{ steps.agents-lint.outputs.report }}
  agents-lint-json:
    description: Path to the JSON AGENTS.md linter report.
    value: ${{ steps.agents-lint.outputs.json }}
  context-score:
    description: Untrusted GitHub event context score, from 0 to 100.
    value: ${{ steps.github-context.outputs.score }}
  context-status:
    description: Untrusted GitHub event context status, either pass or fail.
    value: ${{ steps.github-context.outputs.status }}
  context-report:
    description: Path to the Markdown GitHub event context report.
    value: ${{ steps.github-context.outputs.report }}
  context-json:
    description: Path to the JSON GitHub event context report.
    value: ${{ steps.github-context.outputs.json }}
  benchmark-status:
    description: Built-in fixture benchmark status, either pass or fail.
    value: ${{ steps.benchmark.outputs.status }}
  benchmark-cases:
    description: Number of benchmark cases executed.
    value: ${{ steps.benchmark.outputs.cases }}
  benchmark-report:
    description: Path to the Markdown benchmark report.
    value: ${{ steps.benchmark.outputs.report }}
  benchmark-json:
    description: Path to the JSON benchmark report.
    value: ${{ steps.benchmark.outputs.json }}
  scorecard-status:
    description: Combined scorecard status, either pass or fail.
    value: ${{ steps.scorecard.outputs.status }}
  scorecard-report:
    description: Path to the Markdown scorecard report.
    value: ${{ steps.scorecard.outputs.report }}
  scorecard-json:
    description: Path to the JSON scorecard report.
    value: ${{ steps.scorecard.outputs.json }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 20
    - run: |
        set -euo pipefail
        cd "$GITHUB_ACTION_PATH"
        npm ci
        npm run build
        echo "TRACE_TO_SKILL_CLI=$GITHUB_ACTION_PATH/dist/src/cli.js" >> "$GITHUB_ENV"
      shell: bash
    - run: |
        case "${{ inputs.mode }}" in
          traces|agents-lint|github-context|doctor|benchmark|both|all) ;;
          *) echo "::error::mode must be one of: traces, agents-lint, github-context, doctor, benchmark, both, all"; exit 1 ;;
        esac
      shell: bash
    - id: agents-lint
      run: |
        set -euo pipefail
        node "$TRACE_TO_SKILL_CLI" lint-agents "${{ inputs.doctor-path }}" --format json --output agents-lint-report.json || true
        node "$TRACE_TO_SKILL_CLI" lint-agents "${{ inputs.doctor-path }}" --output agents-lint-report.md || true
        node --input-type=module <<'NODE'
        import { appendFileSync, readFileSync } from "node:fs";
        const report = JSON.parse(readFileSync("agents-lint-report.json", "utf8"));
        const output = [
          `score=${report.score}`,
          `status=${report.status}`,
          "report=agents-lint-report.md",
          "json=agents-lint-report.json"
        ].join("\n");
        appendFileSync(process.env.GITHUB_OUTPUT, `${output}\n`);
        NODE
      if: inputs.mode == 'agents-lint' || inputs.mode == 'all'
      shell: bash
    - run: |
        {
          echo "## trace-to-skill AGENTS.md Lint"
          echo
          cat agents-lint-report.md
        } >> "$GITHUB_STEP_SUMMARY"
      if: always() && inputs.job-summary == 'true' && (inputs.mode == 'agents-lint' || inputs.mode == 'all')
      shell: bash
    - run: |
        echo "::error::AGENTS.md linter failed with score ${{ steps.agents-lint.outputs.score }}"
        exit 1
      if: steps.agents-lint.outputs.status == 'fail' && (inputs.mode == 'agents-lint' || inputs.mode == 'all')
      shell: bash
    - id: github-context
      run: |
        set -euo pipefail
        node "$TRACE_TO_SKILL_CLI" guard-github-event "$GITHUB_EVENT_PATH" --threshold "${{ inputs.context-threshold }}" --format json --output github-context-report.json || true
        node "$TRACE_TO_SKILL_CLI" guard-github-event "$GITHUB_EVENT_PATH" --threshold "${{ inputs.context-threshold }}" --output github-context-report.md || true
        node --input-type=module <<'NODE'
        import { appendFileSync, readFileSync } from "node:fs";
        const report = JSON.parse(readFileSync("github-context-report.json", "utf8"));
        const thresholdText = "${{ inputs.context-threshold }}";
        if (!/^[0-9]{1,3}$/.test(thresholdText)) {
          console.error("::error::context-threshold must be an integer between 1 and 100");
          process.exit(1);
        }
        const threshold = Number(thresholdText);
        if (!Number.isInteger(threshold) || threshold < 1 || threshold > 100) {
          console.error("::error::context-threshold must be an integer between 1 and 100");
          process.exit(1);
        }
        const hasCriticalFindings = report.findings.some((finding) => finding.severity === "critical");
        const status = hasCriticalFindings || report.score < threshold ? "fail" : "pass";
        const output = [
          `score=${report.score}`,
          `status=${status}`,
          "report=github-context-report.md",
          "json=github-context-report.json"
        ].join("\n");
        appendFileSync(process.env.GITHUB_OUTPUT, `${output}\n`);
        NODE
      if: inputs.mode == 'github-context' || inputs.mode == 'all'
      shell: bash
    - run: |
        {
          echo "## trace-to-skill GitHub Context Guard"
          echo
          cat github-context-report.md
        } >> "$GITHUB_STEP_SUMMARY"
      if: always() && inputs.job-summary == 'true' && (inputs.mode == 'github-context' || inputs.mode == 'all')
      shell: bash
    - run: |
        echo "::error::untrusted GitHub event context failed with score ${{ steps.github-context.outputs.score }}/${{ inputs.context-threshold }}"
        exit 1
      if: steps.github-context.outputs.status == 'fail' && github.event_name != 'push' && github.event_name != 'workflow_dispatch' && (inputs.mode == 'github-context' || inputs.mode == 'all')
      shell: bash
    - id: doctor
      run: |
        set -euo pipefail
        node "$TRACE_TO_SKILL_CLI" doctor "${{ inputs.doctor-path }}" --format json --output codex-readiness-report.json
        node "$TRACE_TO_SKILL_CLI" doctor "${{ inputs.doctor-path }}" --output codex-readiness-report.md
        node --input-type=module <<'NODE'
        import { readFileSync } from "node:fs";
        const report = JSON.parse(readFileSync("codex-readiness-report.json", "utf8"));
        const thresholdText = "${{ inputs.doctor-threshold }}";
        if (!/^[0-9]{1,3}$/.test(thresholdText)) {
          console.error("::error::doctor-threshold must be an integer between 1 and 100");
          process.exit(1);
        }
        const threshold = Number(thresholdText);
        if (!Number.isInteger(threshold) || threshold < 1 || threshold > 100) {
          console.error("::error::doctor-threshold must be an integer between 1 and 100");
          process.exit(1);
        }
        const hasFailedChecks = report.checks.some((check) => check.status === "fail");
        const hasCriticalFindings = report.findings.some((finding) => finding.severity === "critical");
        const passesThreshold = report.score >= threshold;
        const status = hasFailedChecks || hasCriticalFindings || !passesThreshold ? "needs-attention" : "ready";
        const output = [
          `score=${report.score}`,
          `status=${status}`,
          `summary=${String(report.summary).replace(/\r?\n/g, " ")}`,
          "report=codex-readiness-report.md",
          "json=codex-readiness-report.json"
        ].join("\n");
        await import("node:fs").then(({ appendFileSync }) => appendFileSync(process.env.GITHUB_OUTPUT, `${output}\n`));
        NODE
      if: inputs.mode == 'doctor' || inputs.mode == 'both' || inputs.mode == 'all'
      shell: bash
    - run: |
        {
          echo "## trace-to-skill Codex Readiness"
          echo
          cat codex-readiness-report.md
        } >> "$GITHUB_STEP_SUMMARY"
      if: always() && inputs.job-summary == 'true' && (inputs.mode == 'doctor' || inputs.mode == 'both' || inputs.mode == 'all')
      shell: bash
    - run: node "$TRACE_TO_SKILL_CLI" doctor-comment "${{ inputs.doctor-path }}" --threshold "${{ inputs.doctor-threshold }}" --token "${{ inputs.github-token }}"
      if: always() && github.event_name == 'pull_request' && inputs.doctor-comment == 'true' && (inputs.mode == 'doctor' || inputs.mode == 'both' || inputs.mode == 'all')
      shell: bash
    - run: |
        echo "::error::Codex readiness doctor status is ${{ steps.doctor.outputs.status }} with score ${{ steps.doctor.outputs.score }}/${{ inputs.doctor-threshold }}"
        exit 1
      if: steps.doctor.outputs.status == 'needs-attention' && (inputs.mode == 'doctor' || inputs.mode == 'both' || inputs.mode == 'all')
      shell: bash
    - id: agent-report
      run: |
        node "$TRACE_TO_SKILL_CLI" analyze "${{ inputs.traces }}" --output agent-learning-report.md
        echo "report=agent-learning-report.md" >> "$GITHUB_OUTPUT"
      if: inputs.mode == 'traces' || inputs.mode == 'both' || inputs.mode == 'all'
      shell: bash
    - run: |
        {
          echo "## trace-to-skill Agent Learning"
          echo
          cat agent-learning-report.md
        } >> "$GITHUB_STEP_SUMMARY"
      if: always() && inputs.job-summary == 'true' && (inputs.mode == 'traces' || inputs.mode == 'both' || inputs.mode == 'all')
      shell: bash
    - run: node "$TRACE_TO_SKILL_CLI" comment "${{ inputs.traces }}" --token "${{ inputs.github-token }}"
      if: github.event_name == 'pull_request' && inputs.comment == 'true' && (inputs.mode == 'traces' || inputs.mode == 'both' || inputs.mode == 'all')
      shell: bash
    - run: node "$TRACE_TO_SKILL_CLI" eval "${{ inputs.traces }}" --threshold "${{ inputs.threshold }}"
      if: inputs.mode == 'traces' || inputs.mode == 'both' || inputs.mode == 'all'
      shell: bash
    - id: benchmark
      run: |
        set -euo pipefail
        node "$TRACE_TO_SKILL_CLI" benchmark --format json --output trace-to-skill-benchmark.json
        node "$TRACE_TO_SKILL_CLI" benchmark --output trace-to-skill-benchmark.md
        node --input-type=module <<'NODE'
        import { appendFileSync, readFileSync } from "node:fs";
        const report = JSON.parse(readFileSync("trace-to-skill-benchmark.json", "utf8"));
        const output = [
          `status=${report.passed ? "pass" : "fail"}`,
          `cases=${report.cases.length}`,
          "report=trace-to-skill-benchmark.md",
          "json=trace-to-skill-benchmark.json"
        ].join("\n");
        appendFileSync(process.env.GITHUB_OUTPUT, `${output}\n`);
        NODE
      if: inputs.mode == 'benchmark' || inputs.mode == 'all'
      shell: bash
    - run: |
        {
          echo "## trace-to-skill Benchmark"
          echo
          cat trace-to-skill-benchmark.md
        } >> "$GITHUB_STEP_SUMMARY"
      if: always() && inputs.job-summary == 'true' && (inputs.mode == 'benchmark' || inputs.mode == 'all')
      shell: bash
    - run: |
        echo "::error::trace-to-skill benchmark failed"
        exit 1
      if: steps.benchmark.outputs.status == 'fail' && (inputs.mode == 'benchmark' || inputs.mode == 'all')
      shell: bash
    - id: scorecard
      run: |
        set -euo pipefail
        node "$TRACE_TO_SKILL_CLI" scorecard "${{ inputs.doctor-path }}" --threshold "${{ inputs.doctor-threshold }}" --format json --output trace-to-skill-scorecard.json
        node "$TRACE_TO_SKILL_CLI" scorecard "${{ inputs.doctor-path }}" --threshold "${{ inputs.doctor-threshold }}" --output trace-to-skill-scorecard.md
        node --input-type=module <<'NODE'
        import { appendFileSync, readFileSync } from "node:fs";
        const report = JSON.parse(readFileSync("trace-to-skill-scorecard.json", "utf8"));
        const output = [
          `status=${report.passed ? "pass" : "fail"}`,
          "report=trace-to-skill-scorecard.md",
          "json=trace-to-skill-scorecard.json"
        ].join("\n");
        appendFileSync(process.env.GITHUB_OUTPUT, `${output}\n`);
        NODE
      if: inputs.mode == 'all'
      shell: bash
    - run: |
        {
          echo "## trace-to-skill Scorecard"
          echo
          cat trace-to-skill-scorecard.md
        } >> "$GITHUB_STEP_SUMMARY"
      if: always() && inputs.job-summary == 'true' && inputs.mode == 'all'
      shell: bash
    - run: node "$TRACE_TO_SKILL_CLI" scorecard-comment "${{ inputs.doctor-path }}" --threshold "${{ inputs.doctor-threshold }}" --token "${{ inputs.github-token }}"
      if: always() && github.event_name == 'pull_request' && inputs.scorecard-comment == 'true' && inputs.mode == 'all'
      shell: bash
    - run: |
        echo "::error::trace-to-skill scorecard failed"
        exit 1
      if: steps.scorecard.outputs.status == 'fail' && inputs.mode == 'all'
      shell: bash
